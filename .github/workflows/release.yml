name: Release

on:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release authorization
        shell: pwsh
        run: |
          $permission = Get-Content RELEASE_PERMISSION.md -Raw
          if ($permission -notmatch '(?im)^Status:\s*(approved|test-approved)\s*$') {
            throw 'RELEASE_PERMISSION.md must record Status: approved or Status: test-approved before publishing.'
          }
      - name: Read pinned upstream commit
        id: upstream
        shell: pwsh
        run: |
          $commit = (Get-Content UPSTREAM_COMMIT -Raw).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') { throw 'UPSTREAM_COMMIT must contain one lowercase 40-character SHA.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: BOTLANNER/BannerlordPlayerSettlement
          ref: ${{ steps.upstream.outputs.commit }}
          path: .cache/upstream
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -ne $tag) { throw "Tag must equal $tag" }
          }
          elseif ($env:REF_TYPE -eq 'branch') {
            if ($env:REF_NAME -ne "release/$tag") { throw "Release branch must equal release/$tag" }
          }
          else {
            throw "Unsupported release ref type: $env:REF_TYPE"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Build release
        shell: pwsh
        run: ./scripts/build.ps1 -UpstreamPath .cache/upstream
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Player Settlements ${{ steps.release.outputs.tag }} Test Release
          prerelease: true
          generate_release_notes: false
          body: |
            Test release for Bannerlord 1.3.15 and The Old Realms 1.16.

            This build preserves the 7.6.12 strategic siege-neighbour integration and restores click routing for visible player-built villages when Bannerlord's map raycast does not return their registered settlement visual.

            The fallback is limited to an unhandled land click within the custom village's map-icon radius. Native selection remains unchanged for ordinary settlements, parties, and every click where Bannerlord already resolved a visual.

            Please verify that existing custom villages can be clicked and entered, while hostile lords and armies continue to siege custom towns and castles correctly.
          files: dist/*
