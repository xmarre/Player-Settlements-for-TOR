name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BOTLANNER/BannerlordPlayerSettlement
          ref: 52d86c7480778afb83e476ac742895f73fbf6d7f
          path: .cache/upstream
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag must equal v$version" }
      - name: Build release
        shell: pwsh
        run: ./scripts/build.ps1 -UpstreamPath .cache/upstream
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
