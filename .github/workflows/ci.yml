name: Build and validate

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BOTLANNER/BannerlordPlayerSettlement
          ref: 52d86c7480778afb83e476ac742895f73fbf6d7f
          path: .cache/upstream
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, validate, and package
        shell: pwsh
        run: |
          try {
            ./scripts/build.ps1 -UpstreamPath .cache/upstream
          }
          catch {
            $details = ($_ | Format-List * -Force | Out-String) + "`nScript stack:`n" + $_.ScriptStackTrace
            [IO.File]::WriteAllText("ci-error.txt", $details, [Text.UTF8Encoding]::new($false))
            throw
          }
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-${{ github.sha }}
          path: ci-error.txt
          if-no-files-found: error
      - name: Upload release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Player-Settlements-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
